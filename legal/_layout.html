<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{__title}} · {{brand}}</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<style>
:root{--bg:#f6f1e7;--card:#fffdf8;--ink:#1a2035;--ink2:#434b65;--line:rgba(26,32,53,.12);--accent:#a8432a}
@media (prefers-color-scheme:dark){:root{--bg:#0d1120;--card:#131a2b;--ink:#f2ebdd;--ink2:#c8c1b3;--line:rgba(242,235,221,.14);--accent:#f0a48a}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.7 -apple-system,BlinkMacSystemFont,"PingFang SC","Segoe UI","Microsoft YaHei",Roboto,sans-serif}
header,footer{max-width:820px;margin:0 auto;padding:18px 20px;display:flex;gap:6px 18px;align-items:center;flex-wrap:wrap}
header a.brand{font-weight:700;color:var(--ink);text-decoration:none;font-size:18px;margin-right:auto}
header a,footer a{color:var(--ink2);text-decoration:none}
header a:hover,footer a:hover,main a{color:var(--accent)}
main{max-width:820px;margin:0 auto;padding:8px 20px 40px}
article{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:28px 30px;margin-bottom:22px}
h1{font-size:30px;line-height:1.25;margin:14px 0 4px}
h2{font-size:19px;margin:26px 0 6px}
p,li{color:var(--ink2)}
.meta{color:var(--ink2);font-size:14px;margin:0 0 10px}
.plans{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:16px;margin:18px 0}
.plan{border:1px solid var(--line);border-radius:16px;padding:20px}
.plan h2{margin-top:0}
.price{font-size:30px;font-weight:700;color:var(--ink);margin:8px 0 4px}
@media (max-width:480px){header,footer{padding:14px 16px;gap:4px 12px}header a.brand{font-size:16px}header a{font-size:13px}article{padding:22px 18px}h1{font-size:26px}}
.tag{display:inline-block;font-size:12px;padding:2px 10px;border-radius:99px;border:1px solid var(--line);color:var(--ink2)}
:root{--btn:#a8432a;--btnink:#fff}
.buy{display:block;width:100%;margin:8px 0;padding:12px 16px;border:0;border-radius:12px;background:var(--btn);color:var(--btnink);font:inherit;font-weight:600;cursor:pointer}
.buy:hover{filter:brightness(1.08)}
.fine{font-size:13px;color:var(--ink2)}
.testmode{background:#f3d98f;color:#2a1c02;border-radius:8px;padding:6px 10px;font-size:13px;font-weight:600}
.keybox{border:2px dashed var(--accent);border-radius:14px;padding:16px;margin-top:14px}
.keybox code{display:block;font-size:clamp(14px,4.6vw,20px);font-weight:700;letter-spacing:.03em;overflow-wrap:normal;color:var(--ink);margin:8px 0}
.keybox a.go{display:inline-block;width:auto;margin:8px 0 0;padding:10px 16px;text-decoration:none;font-size:15px}
.keybox button{padding:8px 14px;border:1px solid var(--line);border-radius:10px;background:transparent;color:var(--ink);font:inherit;cursor:pointer}
[hidden]{display:none!important}
footer{font-size:14px;color:var(--ink2);border-top:1px solid var(--line)}
</style>
</head>
<body>
<header>
<a class="brand" href="/">{{brandZh}} {{brand}}</a>
<a href="/pricing.html">Pricing</a><a href="/terms.html">Terms</a><a href="/privacy.html">Privacy</a><a href="/refund.html">Refunds</a>
</header>
<main>
{{__body}}
</main>
<footer>
<span>© 2026 {{brand}} · {{domain}} · Operated by {{legalName}}</span>
<a href="mailto:{{supportEmail}}">{{supportEmail}}</a>
</footer>
<script>(function(){try{if(!/^zh/i.test(navigator.language||""))return;var zh=document.querySelector('article[lang="zh-CN"]');var first=document.querySelector("main article");if(zh&&first&&zh!==first)first.parentNode.insertBefore(zh,first)}catch(e){}})();</script>
</body>
</html>
